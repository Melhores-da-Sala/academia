<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="home-unidades">

    <header class="gs-global-header">
        <i class="bi bi-list gs-header-menu-icon"></i> 
        <div class="gs-header-logo-area">
            <img src="assets/logo.png" alt="GSports Logo" class="gs-header-logo gs-logo-theme-dark">
            <img src="assets/logo-branca.png" alt="GSports Logo" class="gs-header-logo gs-logo-theme-white">
        </div>
        
        <nav class="gs-header-nav-links">
            <a href="home.html">Home</a>
            <a href="planos.html">Planos</a>
            <a href="#" class="gs-nav-item-active">Unidades</a>
        </nav>

        <a href="cadastro.html">
            <div class="gs-header-profile-icon">
                <i class="bi bi-person-circle"></i>
            </div>
        </a>
    </header>

    <main class="gs-unidades-main-section">
        <h1 class="gs-unidades-title">Nossas Unidades</h1>

        <div class="gs-unidades-container">
            <div class="gs-unidades-list">
                
                <article class="gs-unidade-card">
                    <div class="gs-unidade-img-wrapper">
                        <img src="assets/gspaulista.png" alt="GS Paulista" class="gs-unidade-thumb">
                    </div>
                    <div class="gs-unidade-info">
                        <h2 class="gs-unidade-name">GS Paulista</h2>
                        <p class="gs-unidade-address">
                            <span class="gs-icon-pin">📍</span> Av. Paulista, 1388
                        </p>
                    </div>
                </article>

                <article class="gs-unidade-card">
                    <div class="gs-unidade-img-wrapper">
                        <img src="assets/gsmunis.png" alt="GS Munis" class="gs-unidade-thumb">
                    </div>
                    <div class="gs-unidade-info">
                        <h2 class="gs-unidade-name">GS Munis</h2>
                        <p class="gs-unidade-address">
                            <span class="gs-icon-pin">📍</span> Rua Paulo Fagundes, 302
                        </p>
                    </div>
                </article>

                <article class="gs-unidade-card">
                    <div class="gs-unidade-img-wrapper">
                        <img src="assets/gsjundiai.png" alt="GS Jundiaí" class="gs-unidade-thumb">
                    </div>
                    <div class="gs-unidade-info">
                        <h2 class="gs-unidade-name">GS Jundiaí</h2>
                        <p class="gs-unidade-address">
                            <span class="gs-icon-pin">📍</span> Rua Dr. Filho do Bill, 275
                        </p>
                    </div>
                </article>

            </div>

            <div class="gs-unidades-map-wrapper">
                <img src="assets/mapa-unidades.png" alt="Mapa de Unidades" class="gs-unidades-map-img">
            </div>
        </div>
    </main>

    <footer class="gs-global-footer">
        <div class="gs-footer-wrapper">
            <div class="gs-footer-brand">
                <img src="assets/logo-branca-pequena.png" alt="GSports Logo">
            </div>

            <div class="gs-footer-copyright">
                <p>&copy; 2026 GSPORTS - TODOS OS DIREITOS RESERVADOS</p>
            </div>

            <div class="gs-footer-social-icons">
                <a href="#"><i class="bi bi-instagram"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-whatsapp"></i></a>
            </div>
        </div>
    </footer>
    <script src="js/home.js"></script>
</body>
</html>
