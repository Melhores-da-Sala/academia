<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos - GSports</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f3f4f6;
        }

        /* HEADER */

        .dashprof-cabecalho {
            width: 100%;
            height: 70px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .dashprof-logo img {
            width: 120px;
        }

        .dashprof-menu-hamburguer {
            font-size: 30px;
            cursor: pointer;
            display: none;
        }

        .dashprof-modo-escuro {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CONTAINER */

        .dashprof-container-principal {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* SIDEBAR */

        .dashprof-barra-lateral {
            width: 260px;
            background: #1f2937;
            color: white;
            padding: 20px;
            transition: 0.3s;
        }

        .dashprof-perfil {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .dashprof-foto-perfil i {
            font-size: 50px;
        }

        .menu-navegacao {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
