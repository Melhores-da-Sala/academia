<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotações do Professor - GSports</title>
    <link rel="stylesheet" href="css/anotacoesprofessor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header class="cabecalho">
        <div class="menu-hamburguer" id="btn-hamburguer">
            <i class="bi bi-list"></i>
        </div>
        <div class="logo">
            <a href="dashboardprofessor.html">
                <img src="assets/logo.png" alt="Logo">
            </a>
        </div>
        <div class="modo-escuro" id="btn-modo-escuro">
            <i class="bi bi-circle-half"></i>
            <span>Modo escuro</span>
        </div>
    </header>

    <div class="container-principal">

        <aside class="barra-lateral" id="barra-lateral">
            <div class="perfil">
                <div class="foto-perfil">
                    <i class="bi bi-person-circle"></i>
                </div>
                <div class="info-perfil">
                    <h2>Olá Ruan!</h2>
                    <p>Professor</p>
                </div>
            </div>

            <nav class="menu-navegacao">
                <a href="dashboardprofessor.html" class="item-menu">
                    <i class="bi bi-house-door"></i>
                    DashBoard
                </a>
                <a href="aulasprofessor.html" class="item-menu">
                    <i class="bi bi-book"></i>
                    Aulas
                </a>
                <a href="calendarioprofessor.html" class="item-menu">
                    <i class="bi bi-calendar3"></i>
                    Calendário
                </a>
                <a href="anotacoesprofessor.html" class="item-menu ativo">
                    <i class="bi bi-pencil"></i>
                    Anotações
                </a>
                <a href="alunosprofessor.html" class="item-menu">
                    <i class="bi bi-people-fill"></i>
                    Alunos
                </a>
            </nav>

            <div class="aulasprof-rodape-lateral">
                <a href="index.html">
                    <button class="aulasprof-botao-sair">
                        <i class="bi bi-arrow-left"></i>
                        Sair
                    </button>
                </a>
            </div>
        </aside>

        <main class="conteudo-anotacoes">
            <div class="topo-anotacoes">
                <div class="campo-busca">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Buscar anotação">
                </div>
                <button class="btn-nova-anotacao">
                    <i class="bi bi-plus-circle-fill"></i>
                    Nova anotação
                </button>
            </div>

            <div class="grade-anotacoes">
                <div class="card-anotacao">
                    <h3>Ajuste de treino</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Lembrete admin</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Ideia de aula</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Adicionar nota rápida</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Adicionar nota rápida</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Adicionar nota rápida</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Adicionar nota rápida</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Adicionar nota rápida</h3>
                </div>
                <div class="card-anotacao">
                    <h3>Adicionar nota rápida</h3>
                </div>
            </div>
        </main>

    </div>

    <script>
        const btnHamburguer = document.getElementById("btn-hamburguer");
        const barraLateral = document.getElementById("barra-lateral");

        btnHamburguer.addEventListener("click", () => {
            barraLateral.classList.toggle("oculta");
        });

        const btnModoEscuro = document.getElementById("btn-modo-escuro");
        btnModoEscuro.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>

</body>
</html>
